<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Objetivos do Ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos do Ano<span>_</span></h2>
        
        <div class="botoes">
            <button class="botao" id="btn-ingles">
                <img src="ingles.svg" alt="Ícone Inglês" class="icone-btn">
                Fazer Inglês
            </button>
            <button class="botao" id="btn-enem">
                <img src="enem.svg" alt="Ícone ENEM" class="icone-btn">
                Nota ENEM
            </button>
            <button class="botao" id="btn-vestibular">
                <img src="vestibular.svg" alt="Ícone Vestibular" class="icone-btn">
                Vestibular
            </button>
            <button class="botao" id="btn-curriculo">
                <img src="curriculo.svg" alt="Ícone Currículo" class="icone-btn">
                Currículo
            </button>
        </div>

        <div class="abas-conteudo">
            
            <!-- Conteúdo do Inglês -->
            <div class="aba-conteudo" id="conteudo-ingles">
                <h3 class="aba-conteudo-titulo-principal">Finalidades para o Inglês</h3>
                
                <div class="campo-objetivo">
                    <label for="ingles-obj1">Objetivo 1</label>
                    <textarea id="ingles-obj1" placeholder="Alcançar nível B2 para conversação..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="ingles-obj2">Objetivo 2</label>
                    <textarea id="ingles-obj2" placeholder="Praticar escuta com podcasts diários..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="ingles-obj3">Objetivo 3</label>
                    <textarea id="ingles-obj3" placeholder="Ler 2 livros em inglês até o fim do ano..."></textarea>
                </div>
            </div>

            <!-- Conteúdo do ENEM -->
            <div class="aba-conteudo" id="conteudo-enem">
                <h3 class="aba-conteudo-titulo-principal">Finalidades para o ENEM</h3>
                
                <div class="campo-objetivo">
                    <label for="enem-obj1">Objetivo 1</label>
                    <textarea id="enem-obj1" placeholder="Tirar mais de 900 na Redação..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="enem-obj2">Objetivo 2</label>
                    <textarea id="enem-obj2" placeholder="Fazer 2 simulados por mês..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="enem-obj3">Objetivo 3</label>
                    <textarea id="enem-obj3" placeholder="Revisar Matemática Básica semanalmente..."></textarea>
                </div>
            </div>

            <!-- Conteúdo do Vestibular -->
            <div class="aba-conteudo" id="conteudo-vestibular">
                <h3 class="aba-conteudo-titulo-principal">Finalidades para o Vestibular</h3>
                
                <div class="campo-objetivo">
                    <label for="vestibular-obj1">Objetivo 1</label>
                    <textarea id="vestibular-obj1" placeholder="Dominar as leituras obrigatórias..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="vestibular-obj2">Objetivo 2</label>
                    <textarea id="vestibular-obj2" placeholder="Resolver provas dos últimos 5 anos..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="vestibular-obj3">Objetivo 3</label>
                    <textarea id="vestibular-obj3" placeholder="Treinar gestão de tempo nas provas..."></textarea>
                </div>
            </div>

            <!-- Conteúdo do Currículo (Google Docs) -->
            <div class="aba-conteudo" id="conteudo-curriculo">
                <h3 class="aba-conteudo-titulo-principal">Meu Currículo no Google Docs</h3>
                <iframe 
                    src="https://docs.google.com/document/d/1U83vrY_qnT5jPVnGaHf1C57nIq3u1306e1av0F2DyiM/preview" 
                    title="Documento do Google Docs - Currículo"
                    class="iframe-curriculo">
                </iframe>
            </div>

        </div>

        <!-- Rodapé -->
        <footer class="rodape">
            <p>Criado por: <span>Seu Nome Aqui</span></p>
        </footer>

    </section>

    <script src="main.js"></script>
</body>

</html>
