<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>
        
        <div class="lista-objetivos">
            
            <!-- Grupo 1: Fazer Inglês -->
            <div class="item-objetivo">
                <button class="botao" id="btn-ingles">Fazer inglês</button>
                
                <div class="aba-conteudo" id="conteudo-ingles">
                    <h3 class="aba-conteudo-titulo-principal">Finalidades para o Inglês</h3>
                    
                    <div class="campo-objetivo">
                        <label for="ingles-obj1">Objetivo 1:</label>
                        <textarea id="ingles-obj1" placeholder="Digite seu 1º objetivo com o inglês..."></textarea>
                    </div>

                    <div class="campo-objetivo">
                        <label for="ingles-obj2">Objetivo 2:</label>
                        <textarea id="ingles-obj2" placeholder="Digite seu 2º objetivo com o inglês..."></textarea>
                    </div>

                    <div class="campo-objetivo">
                        <label for="ingles-obj3">Objetivo 3:</label>
                        <textarea id="ingles-obj3" placeholder="Digite seu 3º objetivo com o inglês..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Grupo 2: Tirar boa nota no ENEM -->
            <div class="item-objetivo">
                <button class="botao" id="btn-enem">Tirar boa nota enem</button>
                
                <div class="aba-conteudo" id="conteudo-enem">
                    <h3 class="aba-conteudo-titulo-principal">Finalidades para o ENEM</h3>
                    
                    <div class="campo-objetivo">
                        <label for="enem-obj1">Objetivo 1:</label>
                        <textarea id="enem-obj1" placeholder="Digite seu 1º objetivo para o ENEM..."></textarea>
                    </div>

                    <div class="campo-objetivo">
                        <label for="enem-obj2">Objetivo 2:</label>
                        <textarea id="enem-obj2" placeholder="Digite seu 2º objetivo para o ENEM..."></textarea>
                    </div>

                    <div class="campo-objetivo">
                        <label for="enem-obj3">Objetivo 3:</label>
                        <textarea id="enem-obj3" placeholder="Digite seu 3º objetivo para o ENEM..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Grupo 3: Passar no Vestibular -->
            <div class="item-objetivo">
                <button class="botao" id="btn-vestibular">Passar no Vestibular</button>
            </div>

            <!-- Grupo 4: Criar meu currículo -->
            <div class="item-objetivo">
                <button class="botao" id="btn-curriculo">Criar meu currículo</button>
            </div>

        </div>
    </section>

    <script src="main.js"></script>
</body>

</html>
