<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>
        
        <div class="botoes">
            <button class="botao" id="btn-ingles">Fazer inglês</button>
            <button class="botao" id="btn-enem">Tirar boa nota enem</button>
            <button class="botao" id="btn-vestibular">Passar no Vestibular</button>
            <button class="botao" id="btn-curriculo">Criar meu currículo</button>
        </div>

        <!-- Área onde as finalidades aparecem -->
        <div class="abas-conteudo">
            
            <!-- Conteúdo do Inglês -->
            <div class="aba-conteudo" id="conteudo-ingles">
                <h3 class="aba-conteudo-titulo-principal">Finalidades para o Inglês</h3>
                
                <div class="campo-objetivo">
                    <label for="ingles-obj1">Objetivo 1:</label>
                    <textarea id="ingles-obj1" placeholder="Digite seu 1º objetivo com o inglês..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="ingles-obj2">Objetivo 2:</label>
                    <textarea id="ingles-obj2" placeholder="Digite seu 2º objetivo com o inglês..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="ingles-obj3">Objetivo 3:</label>
                    <textarea id="ingles-obj3" placeholder="Digite seu 3º objetivo com o inglês..."></textarea>
                </div>
            </div>

            <!-- Conteúdo do ENEM -->
            <div class="aba-conteudo" id="conteudo-enem">
                <h3 class="aba-conteudo-titulo-principal">Finalidades para o ENEM</h3>
                
                <div class="campo-objetivo">
                    <label for="enem-obj1">Objetivo 1:</label>
                    <textarea id="enem-obj1" placeholder="Digite seu 1º objetivo para o ENEM..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="enem-obj2">Objetivo 2:</label>
                    <textarea id="enem-obj2" placeholder="Digite seu 2º objetivo para o ENEM..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="enem-obj3">Objetivo 3:</label>
                    <textarea id="enem-obj3" placeholder="Digite seu 3º objetivo para o ENEM..."></textarea>
                </div>
            </div>

            <!-- Conteúdo do Vestibular -->
            <div class="aba-conteudo" id="conteudo-vestibular">
                <h3 class="aba-conteudo-titulo-principal">Finalidades para o Vestibular</h3>
                
                <div class="campo-objetivo">
                    <label for="vestibular-obj1">Objetivo 1:</label>
                    <textarea id="vestibular-obj1" placeholder="Digite seu 1º objetivo para o Vestibular..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="vestibular-obj2">Objetivo 2:</label>
                    <textarea id="vestibular-obj2" placeholder="Digite seu 2º objetivo para o Vestibular..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="vestibular-obj3">Objetivo 3:</label>
                    <textarea id="vestibular-obj3" placeholder="Digite seu 3º objetivo para o Vestibular..."></textarea>
                </div>
            </div>

            <!-- Conteúdo do Currículo -->
            <div class="aba-conteudo" id="conteudo-curriculo">
                <h3 class="aba-conteudo-titulo-principal">Finalidades para o Currículo</h3>
                
                <div class="campo-objetivo">
                    <label for="curriculo-obj1">Objetivo 1:</label>
                    <textarea id="curriculo-obj1" placeholder="Digite seu 1º objetivo para o currículo..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="curriculo-obj2">Objetivo 2:</label>
                    <textarea id="curriculo-obj2" placeholder="Digite seu 2º objetivo para o currículo..."></textarea>
                </div>

                <div class="campo-objetivo">
                    <label for="curriculo-obj3">Objetivo 3:</label>
                    <textarea id="curriculo-obj3" placeholder="Digite seu 3º objetivo para o currículo..."></textarea>
                </div>
            </div>

        </div>

    </section>

    <script src="main.js"></script>
</body>

</html>
